<!doctype html>
<html lang="ko">
  <head>
    <script>
      (function () {
        try {
          var key = 'image-to-excel-theme';
          var stored = localStorage.getItem(key);
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2a9d74" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141820" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="이미지 속 표를 검출하고 AI로 읽어 Excel(.xlsx)로 내보내는 웹 워크숍" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image to Excel — 이미지 표 변환</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
